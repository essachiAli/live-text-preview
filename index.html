<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Text Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50">
    <div class="max-w-2xl mx-auto py-12 px-4">
        <h1 class="text-3xl font-bold text-gray-800 mb-8">Live Text Preview</h1>

        <div class="grid md:grid-cols-2 gap-8">
            <!-- Input -->
            <div>
                <label for="input" class="block text-sm font-medium text-gray-700 mb-2">
                    Type something:
                </label>
                <textarea
                    id="input"
                    rows="10"
                    class="w-full px-4 py-3 text-gray-800 bg-white border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
                    placeholder="Start typing..."></textarea>
            </div>

            <!-- Live Preview -->
            <div>
                <h2 class="text-sm font-medium text-gray-700 mb-2">Live Preview:</h2>
                <div
                    id="preview"
                    class="min-h-40 px-4 py-3 bg-white border border-gray-300 rounded-lg shadow-sm prose prose-sm max-w-none">
                    <!-- Content will be injected here -->
                </div>
                <p id="status" class="mt-2 text-xs text-gray-500"></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
